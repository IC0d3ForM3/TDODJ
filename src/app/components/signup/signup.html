<form class="container mt-4" #signupForm="ngForm" (ngSubmit)="onSubmit()">
	<div class="mb-3">
		<label for="username" class="form-label">Username</label>
		<input type="text" id="username" name="username" class="form-control" required [(ngModel)]="username">
	</div>
	<div class="mb-3">
		<label for="email" class="form-label">Email</label>
		<input type="email" id="email" name="email" class="form-control" required [(ngModel)]="email" email>
		<div *ngIf="email && !isEmailValid(email)" class="text-danger">Invalid email address</div>
	</div>
	<div class="mb-3">
		<label for="password" class="form-label">Password</label>
		<input type="password" id="password" name="password" class="form-control" required [(ngModel)]="password">
		<div *ngIf="password && !isStrongPassword(password)" class="text-danger">
			Password must be at least 8 characters, include uppercase, lowercase, number, and special character.
		</div>
	</div>
	<div class="mb-3">
		<label for="confirmPassword" class="form-label">Confirm Password</label>
		<input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required [(ngModel)]="confirmPassword">
		<div *ngIf="confirmPassword && password !== confirmPassword" class="text-danger">Passwords do not match</div>
	</div>
	<button type="submit" class="btn btn-primary" [disabled]="!canSave()">Save</button>
	<div class="mt-3">
		<div *ngIf="result === 1" class="alert alert-success">Signup successful!</div>
		<div *ngIf="result === 2" class="alert alert-warning">Email is already used.</div>
		<div *ngIf="result === -1 || error" class="alert alert-danger">Signup failed. {{ error }}</div>
	</div>
</form>
