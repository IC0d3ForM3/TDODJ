<div class="ad-interstitial-overlay">
  <div class="ad-interstitial-box">

    @if (message) {
      <div class="ad-interstitial-npc-message">
        <span class="ad-npc-icon">🏠</span>
        <p>"{{ message }}"</p>
      </div>
    }

    <div class="ad-unit">
      <!--
        ═══════════════════════════════════════════════════════════
        ADSENSE PUBLISHER: ca-pub-8747092902350073  (loader is in index.html)
        When Google provides an ad slot ID, replace the .ad-placeholder div
        below with the <ins> push tag, e.g.:

        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-8747092902350073"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        ═══════════════════════════════════════════════════════════
      -->
      <div class="ad-placeholder">
        <span>[ Advertisement ]</span>
        <small>Subscribe to remove ads</small>
      </div>
    </div>

    <button type="button" class="ad-continue-btn" (click)="onContinue()">
      Continue &rarr;
    </button>

  </div>
</div>
