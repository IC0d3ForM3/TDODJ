<div class="login-page">
  <div class="login-card">
    <div class="login-icon">🗝️</div>
    <h2 class="login-title">Enter the Dungeon</h2>
    <p class="login-sub">Sign in to your account to continue your adventure.</p>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required [(ngModel)]="username" autocomplete="username" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required [(ngModel)]="password" autocomplete="current-password" />
      </div>

      <div *ngIf="error" class="login-error">{{ error }}</div>

      <button type="submit" class="login-btn">Log In</button>
    </form>

    <p class="login-footer">
      Don't have an account? <a routerLink="/signup">Sign up free</a>
    </p>
  </div>
</div>
