<div class="contact-page">
  <h2>Contact Us</h2>
  <p class="contact-intro">Have a question, found a bug, or just want to say hi? Fill out the form below.</p>

  @if (successMsg()) {
    <div class="alert alert-success">{{ successMsg() }}</div>
  }

  @if (errorMsg()) {
    <div class="alert alert-danger">{{ errorMsg() }}</div>
  }

  <form class="contact-form" (ngSubmit)="submit()" #contactForm="ngForm">
    <div class="form-group">
      <label for="contact-name">Name <span class="required">*</span></label>
      <input
        id="contact-name"
        type="text"
        [(ngModel)]="name"
        name="name"
        required
        placeholder="Your name"
      />
    </div>

    <div class="form-group">
      <label for="contact-email">Email <span class="required">*</span></label>
      <input
        id="contact-email"
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="your@email.com"
      />
    </div>

    <div class="form-group">
      <label for="contact-problem">Problem Type <span class="required">*</span></label>
      <select id="contact-problem" [(ngModel)]="problem" name="problem">
        @for (opt of problemOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="contact-username">Username <span class="optional">(optional)</span></label>
      <input
        id="contact-username"
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Your in-game username"
      />
    </div>

    <div class="form-group">
      <label for="contact-message">Message <span class="required">*</span></label>
      <textarea
        id="contact-message"
        [(ngModel)]="message"
        name="message"
        required
        rows="6"
        placeholder="Describe your issue or question..."
      ></textarea>
    </div>

    <button
      type="submit"
      class="btn-submit"
      [disabled]="isSubmitting() || !name || !email || !message"
    >
      @if (isSubmitting()) { Sending... } @else { Send Message }
    </button>
  </form>
</div>
